<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GET ELEMENT tasks</title>
</head>
<body>
    <form>
        <input type="text" placeholder="Enter the  table value" id="number1" name="number1">
        <input type="text" placeholder="till" id="number2" name="number1">
        <input type="button" value="print table" onclick="table()">
    </form>
    <script>
        function table(){
            var num1 = document.getElementById("number1").value;
            var num2 = document.getElementById("number2").value;
            for(var i=1;i<=num2;i++){
                document.write((i*num1)+"<br>")
            }
        }
    </script>
</body>
</html>
