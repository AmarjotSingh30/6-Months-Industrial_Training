<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>e-commerce project</title>
    <link rel="stylesheet" href="style.css">

<body>
    <!-- navbar -->
    <div class="navbar">

        <div class="navbar-logo">
            <img src="images/logo.png">

        <!-- navbar-links -->
        <div class="navbar-links">
            <ul>
                <li><a href="#">HOME</a></li>
                <li><a href="#">SHOP</a></li>

        </div>

            <a href="#">Register</a>

            <i class="fa-solid fa-bag-shopping"></i>
        </div>
    </div>
    <!-- navbar -->
    <!-- box2 -->
    <div class="box2">

        <div class="box2-inbox1">

            <p>Lorem ipsum, dolor sit amet consectetur adipisicing elit. Culpa ullam ipsa, tempore dolorum aliquid voluptatem qui quod! Odit quis earum aliquam cumque </p>

        <div class="box2-inbox2">
            <!-- double inside box1 -->
            <div class="box2-inbox2-ddinbox1">
                <!-- triple inside box1 -->
                <div class="ddinbox1-inbox1"></div>
                <div class="ddinbox1-inbox2"></div>
            </div>
            <!-- lower section in box2 -->
            <!-- double inside box1 -->
            <div class="box2-inbox2-ddinbox2">
                <!-- triple inside box1 -->
                <div class="ddinbox2-inbox1"></div>
                <div class="ddinbox2-inbox2"></div>
