<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>remove method</title>
    <style>
        #box{
            width: 100%;
            height: 40vh;
            border: 1px solid red;
        }
    </style>
</head>
<body>
    <h1>jquery empty & remove method</h1>

    <div id="box">
        <h2>text box</h2>
        <p>Lorem ipsum dolor sit, amet consectetur adipisicing elit. Ea alias, rerum nesciunt aperiam voluptas voluptates nisi vitae doloremque consequuntur soluta fugiat ipsum quo possimus ipsam pariatur harum id hic magni!</p>
    </div>

    <button id="emptybtn">Empty</button>
    <button id="removebtn">remove</button>

    <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
        <script>
             $(document).ready(function(){
                $('#emptybtn').click(function(){
                    $('#box').empty();
                });

                 $('#removebtn').click(function(){
                    $('#box h2').empty();
                });

                 $('removebtn').click(function(){
                    $('#box').remove();
                });
                
             });
        </script>

</body>
</html>
