<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fade method</title>
</head>
<body>
    <h1>fade in and out method</h1>
    <div id="box">
        <h2>text box</h2>
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Commodi necessitatibus id nostrum quod minima perspiciatis pariatur laudantium reiciendis iure qui similique recusandae quos dolor minus quas, tempore reprehenderit fugit beatae?</p>
    </div>
    <button id="fadetobtn">fade to</button>
    <button id="fadeoutbtn">fade out</button>
    <button id="fadeinbtn">fade in</button>
    <button id="fadetogglebtn">fade toggle</button>

    <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
    <script>
         $(document).ready(function(){

                $('#fadeoutbtn').click(function(){
                    $('#box').fadeOut("slow");
                });

                $('#fadeinbtn').click(function(){
                    $('#box').fadeIn("slow");
                });

                $('#fadeoutbtn').click(function(){
                    $('#box').fadeOut("3000,function");
                    console.log("now its hidden")
                });

                $('#fadetogglebtn').click(function(){
                    $('#box').fadeToggle(2000,function(){
                        console.log("now its hidden")
                    });
                });

                $('#fadetobtn').click(function(){
                    $('#box').fadeTo(2000,0.5,function(){
                        console.log("now its hidden")
                    });
                });
            });
    </script>
</body>
</html>
