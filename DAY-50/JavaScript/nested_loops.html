<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nested loops</title>
</head>
<body>
    <script>
        // ----nested for loop---
        var i,j;
        for(i=1;i<=5;i++){
            for(j=1;j<=5;j++){
                document.write(" * ");
            }
            document.write("<br>");
        }
        document.write("<br>----------------------------<br>");

        // ----nested do while loop----
        i=1;
        do{
            j=1;
            do{
                document.write(" * ");
                j++;
            }while(j<=5);
            document.write("<br>");
            i++;
        }while(i<=5);
        document.write("<br>----------------------------<br>");

        // ----nested while loop----
        i=1;
        while(i<=5){
            j=1;
            while(j<=5){
                document.write(" * ");
                j++;
            }
            document.write("<br>");
            i++;
        }
         document.write("<br>----------------------------<br>");

        // ----[task]to print pattern like given----
        // with for loop
        for(i=1;i<=3;i++){
            for(j=1;j<=10;j++){
                document.write(" * ")
            }
            document.write("<br>")
        }
            document.write("<br>----------------------------<br>");

        // [task] to print pattern like given
        // with for loop
        for(i=1;i<=5;i++){
            for(j=i;j<=5;j++){
                document.write(" * ")
            }
            document.write("<br>")
        }
    </script>
</body>
</html>
