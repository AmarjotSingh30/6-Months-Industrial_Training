<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nested loops task</title>
</head>
<body>
        <script>
    //----task-1 print pattern like given----
    document.write("TASK-1 with nested for loop <br>")
        var i,j;
        for(i=1;i<=5;i++){
            for(j=1;j<=6-i;j++){
                document.write(j);
            }
            document.write("<br>");
        }

        //----task-2 print pattern like given----
        var i,j,k;
        for(i=1;i<=5;i++){
            for(j=1;j<=5-i;j++){
                document.write("-")
            }
            for(var k=1;k<=i;k++){
                document.write("*")
            }
            document.write("<br>");
        }

        </script>
</body>
</html>
