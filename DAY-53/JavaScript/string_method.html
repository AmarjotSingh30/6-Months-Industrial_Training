<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>String Method</title>
</head>
<body>
    <script>
        const str="helloworld";
        document.write(str.length+"<br>");
        document.write(str.charAt(4)+"<br>");
        document.write(str.endsWith("d")+"<br>");
        document.write(str.includes("world")+"<br>");
        document.write(str.indexOf("world")+"<br>");
        document.write(str.replace("world","myworld")+"<br>");
        document.write(str.repeat(5)+"<br>");
        document.write(str.slice(6,10)+"<br>");
        document.write(str.split("")+"<br>");
        document.write(str.startsWith("hello")+"<br>");
        document.write(str.substring("3,8")+"<br>");
        document.write(str.substr(1,4)+"<br>");
        document.write(str.toLowerCase("world")+"<br>");
        document.write(str.toUpperCase("world")+"<br>");
        document.write("abhay"+"    hello world ".trim()+"<br>");

        












    </script>
</body>
</html>
