<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math</title>
</head>
<body>
    <script>
        document.write(Math.PI+"<br>");
        document.write(Math.sqrt(64)+"<br>");
        document.write(Math.abs(-46)+"<br>");
        document.write(Math.pow(6,6)+"<br>");
        document.write(Math.cbrt(125)+"<br>");
        document.write(Math.ceil(64.69)+"<br>");
        document.write(Math.round(64.10)+"<br>");
        document.write(Math.floor(64.10)+"<br>");
        document.write(Math.min(64,10,6,78)+"<br>");
        document.write(Math.max(64,10,90)+"<br>");
        document.write(Math.random()+"<br>");
        document.write(Math.floor(Math.random()*501)+"<br>");





    </script>
</body>
</html>
